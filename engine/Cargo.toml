[package]
name = "tvshields-engine"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "tvshields blocking engine: a thin wrapper around adblock-rust for Android"
repository = "https://github.com/merytech1/tvshields"
publish = false

[lib]
name = "tvshields_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
# No `single-thread`: the engine is shared across WebView threads (rules C2).
# `css-validation` splits procedural selectors (`:has-text`, `:upward`, …) into the structured
# `procedural_actions` format and rejects invalid CSS (roadmap 4.3).
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
serde_json = "1"

# The JNI bridge only runs on Android; host builds (tests) skip it.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# No `panic = "abort"`: panics must unwind so the JNI bridge can turn them into Kotlin exceptions.
