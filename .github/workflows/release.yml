# Builds the release APKs (universal and one per ABI) signed with the release key (roadmap 9.2) and,
# on a version tag, creates a draft GitHub release with them (roadmap 9.4). The maintainer reviews
# the draft and publishes it. Every release also carries tvshields.apk, a copy of the universal APK
# under a fixed name, so /releases/latest/download/tvshields.apk always serves the latest version.
# The key lives only in GitHub secrets: RELEASE_KEYSTORE_BASE64 (the PKCS12 file in base64) and
# RELEASE_KEYSTORE_PASSWORD.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Signed release APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts."
            exit 1
          fi

      - uses: ./.github/actions/android-build

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 secret is not set (docs/resources/toolchain.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "TVSHIELDS_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build the signed APKs
        env:
          TVSHIELDS_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Verify the signatures
        working-directory: app/build/outputs/apk/release
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          for apk in *.apk; do
            echo "== $apk"
            "$apksigner" verify --print-certs "$apk"
          done
          sha256sum *.apk

      - name: Check the APK size
        run: .github/scripts/apk-size.sh app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: app/build/outputs/apk/release/*.apk

  publish:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: dist

      # app-<abi>-release.apk becomes tvshields-<tag>-<abi>.apk. tvshields.apk is the universal APK
      # under a fixed name, for the Downloader URL that always points to the latest release.
      - name: Name the files and write the checksums
        working-directory: dist
        run: |
          for apk in app-*-release.apk; do
            abi=${apk#app-}
            mv "$apk" "tvshields-$GITHUB_REF_NAME-${abi%-release.apk}.apk"
          done
          cp "tvshields-$GITHUB_REF_NAME-universal.apk" tvshields.apk
          sha256sum *.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Release notes $notes are missing."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "tvshields $GITHUB_REF_NAME" --notes-file "$notes" \
            dist/*.apk dist/SHA256SUMS
