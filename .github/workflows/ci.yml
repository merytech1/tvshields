# Builds the engine and the APK and runs the tests on every pull request (roadmap 9.1).
# Instrumented tests (app/src/androidTest) need an ARM device; they run on the TV over adb.
name: ci

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Rust engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Test
        working-directory: engine
        run: cargo test --locked

  apk:
    name: APK and Kotlin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/android-build

      - name: Kotlin unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build the APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest

      - name: Check the APK size
        run: .github/scripts/apk-size.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      # Unsigned here: only the release workflow has the key (roadmap 9.2).
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
