# Builds the engine and the APK and runs the tests on every pull request (roadmap 9.1).
# Instrumented tests (app/src/androidTest) need an ARM device; they run on the TV over adb.
name: ci

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Rust engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Test
        working-directory: engine
        run: cargo test --locked

  apk:
    name: APK and Kotlin tests
    runs-on: ubuntu-latest
    env:
      # Same NDK as the local toolchain (docs/resources/toolchain.md).
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install the NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            # cmdline-tools 23+ use `/` in package paths; older ones use `;`.
            yes | "$sdkmanager" "ndk/$NDK_VERSION" || yes | "$sdkmanager" --install "ndk;$NDK_VERSION"
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build the engine
        run: engine/build-android.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build the APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      # Release is unsigned until roadmap 9.2.
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
